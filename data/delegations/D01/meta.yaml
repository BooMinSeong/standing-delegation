# ------------------------------------------------------------------ 자리 A(D)
a_slot_text: >-
  이 상품을 발주할 수 있는 공급업체가 여럿일 때 어느 공급업체에 발주하는가. q는 상품(PROD-001),
  수량(100), 적격성(활성 계약이 발주를 허용)까지 정하고 공급업체 선택만 열어 둔다. 위임당 자리는
  하나다(docs/LOGIC.md §0).
a_feature_ids: ["cand_uniqueness", "num_extremum", "capacity_balance"]   # D-012. 롤아웃 전 PREREG 동결 대상
a_feature_note: >-
  섭동표 v1 §3의 특징 목록에서 셋 다 근거가 있고, 그중 둘은 **눈가림 도출자가 이 씨앗 문항을
  직접 예로 들었다**: `num_extremum`(13위, 8/131. 어휘 목록에 'lowest-cost'가 있고 예시에
  emergent_risk_discovery/preview_018)과 `capacity_balance`(11위, 11/131. 어휘 목록에 'can fulfill'이
  있고 예시에 같은 문항). `cand_uniqueness`(1위, 69/131)는 commit의 supplier_id가 지시문에 문자열로
  없어서 걸린다.
coverage: "partial"               # in / partial / out 3값 (D-024 L40)
unrepresented_feature_ids: ["num_extremum", "capacity_balance"]
coverage_basis: >-
  D-012·L29대로 사후 검사로 판정했다. checks.md (c)에서 R이 V_D의 다섯 규칙과 각각 fork 9상태 중
  6~8행에서 다른 대상을 낸다(f_discriminates_r = true, 옛 R보다 훨씬 세다). 그런데 a_feature_ids
  셋 중 둘은 동결 8행에 대표 행이 없다: `num_extremum`(P28·P29), `capacity_balance`(P24·P25).
  그래서 in이 아니라 **partial**이다(L40). 특히 P24("여유분을 요청량보다 작게")는 섭동표가 이
  씨앗 문항을 예로 든 행인데 8행 밖이다. R이 갈리는 것은 간접 효과에 기댄다: P01의 복제가 우연히
  "셋 다 수량 미달"(f01, R = ∅)을 만들고, P04의 수치 배율표가 추가 후보의 가용 수량을 정확히
  발주량과 같게(100) 만들었다(P25의 상황). 자리 노출률·불일치 행 비율은 이 값으로 층화해 보고한다.
