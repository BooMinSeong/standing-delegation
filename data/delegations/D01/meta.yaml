authoring_order: "씨앗 유도 (q도 R도 짓지 않음)"
authoring_order_detail:
  1: "씨앗 문항(preview_018/act)의 instruction·execution_dag·pair_description을 읽는다"
  2: "q_plus.txt = 씨앗 instruction + 상시 실행 프레이밍 + 적격성 한 문장(DAG n2 근거)"
  3: "R = 씨앗 instruction의 마지막 절 → rule.py. q_minus.txt = q_plus에서 그 절만 지운 판"
