      비분기가 아니다(L42). 측정용 8에 넣지 않았고 held-out에서 별도 부류로 둔다.
  heldout: {count: 0, note: "Stage 1에서 만든다 (Plan.md §7)"}
  fork:
    count: 9                        # 섭동표 8행 + 무편집 기준 행 P00 (D-022 ③, Plan v2.1 §4.3)
    rows: ["P00", "P01", "P04", "P07", "P09", "P11", "P13", "P16", "P18"]
    inapplicable: ["P09", "P11"]    # 적용 불가여도 구분 행 회계에는 들어간다 (D-024 L35)
    inapplicable_note: >-
      P09는 이 환경에 현재 시각 필드가 없어서, P11은 q가 가리키는 기준 개체(catalog_products와
