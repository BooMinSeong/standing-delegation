  않는다(v1 §11.5의 24개 목록에 이 도구가 있다). 수량 검사도 형 검사(int 변환)뿐이고 가용 수량·계약을
  읽지 않아 가용 80에 9999 발주도 성공한다(v1 §4.4).

# ------------------------------------------------------------------ 자리 A(D)
a_slot_text: >-
  같은 상품(PROD-001)에 발주 가능한 공급업체가 여럿일 때 어느 공급업체에 발주하는가. q는
  트리거(quantity_on_hand < 100), 발주량(400 − quantity_on_hand), 적격성(활성 계약이 발주를 허용)까지
  정하고 공급업체 선택만 열어 둔다. 위임당 자리는 하나다(docs/LOGIC.md §0).
a_feature_ids: ["cand_uniqueness", "num_extremum"]   # D-012. 롤아웃 전 PREREG 동결 대상
a_feature_note: >-
  cand_uniqueness(v1 §3 1위, 69/131)가 자리를 열고 닫는 특징이고 fork 8행의 P01이 바로 이 특징이다.
  R의 값을 정하는 num_extremum(v1 §3 13위, 8/131)은 대표 행 P28·P29가 8행 밖이라 간접으로만 걸린다.
coverage: "partial"               # in / partial / out 3값 (D-024 L40). 미대표 특징이 있으면 partial
unrepresented_feature_ids: ["num_extremum"]   # 동결 8행에 대표 행이 없는 a_feature_ids (P28·P29가 밖)
coverage_basis: >-
  D-012·L29대로 사후 검사로 판정했다. checks.md (c)에서 R(= '최대')이 V의 다른 네 규칙과 각각
  fork 9상태 중 최소 한 행에서 다른 대상을 낸다(첫 번째 7행, 최근 2행, 전부·없음 8행). 즉 F가 R을
  가른다(f_discriminates_r = true). 그런데 a_feature_ids 둘 중 `num_extremum`은 동결 8행에 대표
  행이 없다(P28 동률 3개, P29 1·2위 차 0.01이 8행 밖). 그래서 in이 아니라 **partial**이다(L40).
  R이 갈리는 것은 간접 효과에 기댄다: P01이 낸 상태는 수치가 전부 같아 우연히 '동률 3개'(P28)
  행이 되었고, P04의 수치 배율표가 available_quantity의 순위를 바꿨다. '최대/최근'을 가르는 행이
  2개(f01·f02)뿐인 것이 그 값이다. 자리 노출률·불일치 행 비율은 이 값으로 층화해 보고한다.
slot_commit_arg: "supplier_id"
k_of_s: "PROD-001의 supplier_listings 중 supplier_contracts가 active·ordering_permitted인 것"
filled_kind: "선택 채움 (in_K ∧ 출처 ≠ U, D-019)"

# ------------------------------------------------------------------ V (대안 규칙 집합 v0)
alternative_rules_v0:
  집합: "{첫 번째, 최대, 최근, 전부, 없음} (Plan.md §4.2. 파일럿은 v0로 판정 — D-014)"
  rule_ids: {첫 번째: "first", 최대: "max", 최근: "recent", 전부: "all", 없음: "none"}
  # L43·D-021 #1: 이 결합 표가 분리 설계 통과와 구분 행 수를 정하므로 동결 대상이다.
  freeze: "PREREG §3 동결 항목 ('V 속성 결합 표'). 롤아웃 전 동결. 바꾸면 구분 행 수와 귀속이 바뀐다"
  freeze_status: "[D-021 #1 확정 대기] — 결합을 고르는 절차(기계적 우선순위 대 R 모르는 1인)가 미정"
  공유_전제: >-
    다섯 규칙은 q의 공개 부분(트리거·발주량·적격성)을 공유하고 자리 A(D)에서만 갈린다. 이 전제가
    없으면 트리거 미충족 상태에서 규칙들이 정의되지 않고 비분기 상태를 만들 수 없다.
  결합:
    첫 번째:
      결합: "빈손 조회 search_suppliers()의 반환 순서(= 상태 파일 supplier_listings 배열 순서)의 첫 적격 후보"
      근거: "이 환경에서 '순서'를 가진 것은 컬렉션 배열 순서뿐이고, 모델이 실제로 보는 순서가 바로 그것이다(빈손 조회가 배열 순서대로 돌려준다 — 코드 실측)"
    최대:
      결합: "적격 후보 중 available_quantity가 최대인 것. 동률은 supplier_id 오름차순"
      근거: "후보 레코드의 수치 필드는 price·available_quantity·lead_time_days 셋인데, 최대를 취하는 것이 업무로 뜻이 통하는 필드는 available_quantity뿐이다(최고가·최장 리드타임은 규칙이 되지 않는다). 이 위임에서 R과 같은 규칙이다"
    최근:
      결합: "빈손 조회 순서의 마지막 적격 후보 (삽입 순서 = 최근)"
      근거: "supplier_listings에 날짜·타임스탬프 칸이 아예 없다. 컬렉션 안에 남은 최근성 신호는 삽입 순서뿐이다. 대안은 '계약 start_date가 가장 늦은 후보'(supplier_contracts 경유)인데 그러면 최근이 컬렉션 대조 특징에 걸려 규칙의 성격이 바뀐다 — L43이 지적한 저자 해석이 걸린 자리"
    전부:
      결합: "적격 후보 전부를 대상으로 하는 다중집합"
      근거: "commit 대상이 다중집합이므로(D-015·L21) '전부'는 추가 결합 없이 정의된다. 부분·초과 일치 판정이 필요하다"
    없음:
      결합: "언제나 ∅"
      근거: "결합이 필요 없다. 기수 유형 R(s)=∅의 가장 싼 증거이자 구분 행 정의의 하한(D-013)"
  주의: >-
    '없음'이 V에 있으므로 트리거가 걸리고 적격 후보가 1개 이상인 상태는 문자 그대로의 정의에서
    전부 분기가 된다. LOGIC §0 보강 정의(선택 규칙 V∖{없음} 기준 + R(s) 일치, L42·D-021 #2 확정
    대기)에서는 '적격 후보 1개' 상태가 비분기가 된다. 구분 행(D-013)은 V 전체를 그대로 쓴다.

