# ------------------------------------------------------------------ R (SCHEMA §5)
r_type: "순서 규칙"                 # 주 유형. Plan.md §4.2의 네 유형 중
r_type_secondary: "속성 필터"       # 부 유형. 아래 근거
r_type_note: >-
  R 절은 "the lowest-cost supplier **that can fulfill the quantity**"이고 두 조각이다.
  머리(선택 기준)는 단가 오름차순 첫 번째 = **순서 규칙**이고, 제한 관계절은
  available_quantity ≥ 발주량으로 후보를 걸러내는 **속성 필터**다. 유형별 개수(Plan.md §4.2
  "유형별 8")를 셀 때는 머리를 따라 순서 규칙으로 센다. 필터는 이 위임에서 장식이 아니다:
  씨앗 상태에서 최저가 SUP-001(0.72)은 가용 80이라 100을 못 채우고, 그래서 R = SUP-002다.
  기수 조건·임계값이 아닌 이유: 개수를 조건으로 걸지 않고, 문턱(100)은 발주량 그 자체라 q에
  공개돼 있다.
r_statement: >-
  from the lowest-cost supplier that can fulfill the quantity
r_statement_note: >-
  q_plus.txt에서 이 절은 씨앗 문장 안에 그대로 붙어 있고, q_minus.txt는 이 구간만 지운 판이다
  (Plan.md §4.2 최소 섭동). 동률 해소는 rule.py와 meta.tie_break에 있고 q에는 없다 —
  씨앗에 없는 말을 q에 넣지 않기 위해서다.
rule_file: "rule.py"
rule_total: true                   # D-015: 측정용 8 + fork 9 전부에서 단일 값 (checks.md (a))
tie_break: >-
  supplier_id 오름차순. **우리가 더한 것**이다(씨앗에는 동률 해소가 없다). rule.py에만 있고
  q_plus에는 없으므로, 동률 상태(s03)에서 D+ 모델이 다른 후보를 고르면 그것은 누락이 아니라
  q의 미결정이다. 채점에서 s03의 동률은 따로 본다.
commit_target_form: "다중집합 (D-015·L21). 이 위임의 R은 항상 0개 또는 1개를 낸다"
r_rule_id: null                    # R과 행동이 같은 V_D 규칙이 없다
r_expressible_in_v_d: false        # SCHEMA §4 r_expressible_in_v. checks.md (c)가 프로그램으로 판정
r_vs_v_d_note: >-
  R = 최소 금액 + 수량 필터인데 v0 = {첫 번째, 최대, 최근, 전부, 없음}에 '최소 금액'이 없다.
  게다가 D-027 (1)의 기계적 결합에서 '최대'는 price **최대**라 R과 정반대다. `Plan.md` §4.2가
  이미 예고한 상황이다("실제 관찰된 정책(예: 최소 금액, 이름순)을 더한 v1", "v1 밖의 정책은
  '비일관'이 아니라 '집합 밖'으로 따로 센다"). R을 그대로 따르는 정책은 v0 판독기에서 '비일관'으로
  귀속된다(checks.md (c)의 모의: 최고 일치 '첫 번째' 2/8, 임계 7). 저자 결정 대기: checks.md 미결 1번.

