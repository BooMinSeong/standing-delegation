delegation_id: "D01"
title: "재고가 문턱 아래로 내려가면 발주 (조달·재고)"

# ------------------------------------------------------------------ R (SCHEMA §5)
r_type: "순서 규칙"                 # Plan.md §4.2의 네 유형 중. 수치 필드의 극값 순서
r_rule_id: null                    # 기계적 결합(D-027 (1)) 뒤 R과 행동이 같은 V_D 규칙이 없다
r_expressible_in_v_d: false        # SCHEMA §4 r_expressible_in_v. checks.md (c)가 프로그램으로 판정
r_vs_v_d_note: >-
  옛 결합(저자 손 선택: '최대' = available_quantity)에서는 R = '최대'였다. D-027 (1)의 기계적
  결합에서 '최대'는 레코드의 **첫 숫자 필드**(schema.py 선언 순서로 price)가 최대인 후보이므로
  R(available_quantity 최대)과 다르다. fork 9행 중 f02(P04)에서, 측정용 8 중 s03·s04에서 갈린다.
  판독기의 임계(구분 행 n−1 = 7)에서는 R을 그대로 따르는 정책이 여전히 '최대'로 귀속되지만
  (8행 중 7행 일치), `equals_r`는 전 행 일치를 요구하므로 false가 된다. 저자 결정 대기:
  checks.md 미결 1번.
r_statement: >-
  When more than one supplier may be ordered from, order from the one with the largest
  available_quantity, and if two or more of them are tied on available_quantity, order from the
  one whose supplier_id sorts first in ascending order.
r_type_note: >-
  R은 적격 후보를 available_quantity 내림차순, 동률은 supplier_id 오름차순으로 세워 첫 번째를
  고른다. 속성으로 후보를 걸러내지 않으므로 속성 필터가 아니고, 개수를 조건으로 걸지 않으므로
  기수 조건이 아니며, 문턱(100·400)은 q에 공개돼 있어 임계값 유형이 아니다.
rule_file: "rule.py"
rule_total: true                   # D-015: 측정용 8 + fork 9 전부에서 단일 값 (checks.md (a))
tie_break: "supplier_id 오름차순. rule.py와 q_plus.txt 6번 문장 양쪽에 같은 말로 있다 (D-015)"
commit_target_form: "다중집합 (D-015·L21). 이 위임의 R은 항상 0개 또는 1개를 낸다"

