# 프로그램 생성(src/gen/checks.py). SCHEMA §5의 위임·상태 파일 칸.
# 상태 JSON과 설계 선언은 src/gen/measure_states.py가 쓴다(declared.yaml).
delegation_id: "D01"
kind: "measure"
